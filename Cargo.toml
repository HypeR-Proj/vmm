bin = [{name = "hyper-vmm", path = "src/main.rs", test = false, bench = false}]

[package]
name = "hyper-vmm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/vmm"
publish = false
autotests = false

[dependencies]

[dependencies.hyper-os]
version = "=0.0.0"

[dependencies.hyper-rt]
version = "=0.0.0"
features = ["std"]

[dependencies.hyper-terminal]
path = "../../lib/terminal"

[dependencies.hyper-service]
path = "../../lib/service"

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]

[target]

[target."cfg(target_os = \"hyper\")"]

[target."cfg(target_os = \"hyper\")".dependencies]

[target."cfg(target_os = \"hyper\")".dependencies.hyper-clap-shared]
path = "../../lib/clap"
default-features = false
features = ["derive"]

[target."cfg(target_os = \"hyper\")".dependencies.hyper-vm-policy-shared]
path = "../../lib/vm-policy/shared"
default-features = false

[target."cfg(not(target_os = \"hyper\"))"]

[target."cfg(not(target_os = \"hyper\"))".dependencies]

[target."cfg(not(target_os = \"hyper\"))".dependencies.hyper-vm-policy]
path = "../../lib/vm-policy"

[target."cfg(not(target_os = \"hyper\"))".dependencies.clap]
version = "=4.6.6"
features = ["derive"]

[workspace]
resolver = "3"
members = []

[profile]

[profile.release]
codegen-units = 1
debug = 1
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = "none"
